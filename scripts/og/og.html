<!doctype html>
<!-- 1200×630 social card. Rendered to public/og.png by scripts/render-og.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0a0a; }
  body {
    position: relative;
    color: #f1f1ed;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  }
  canvas { position: absolute; inset: 0; }
  .domain {
    position: absolute; top: 64px; left: 72px;
    font-size: 22px; letter-spacing: -0.01em; color: #989893;
  }
  .name {
    position: absolute; left: 68px; bottom: 132px; margin: 0;
    font-size: 96px; font-weight: 500; line-height: 1; letter-spacing: -0.06em;
  }
  .role {
    position: absolute; left: 72px; bottom: 72px; margin: 0;
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 40px; font-style: italic; line-height: 1; letter-spacing: -0.04em;
    color: #c9c9c4;
  }
</style>
</head>
<body>
  <canvas width="1200" height="630"></canvas>
  <div class="domain">charlieconner.com</div>
  <h1 class="name">Charles Conner</h1>
  <p class="role">Product engineer.</p>
  <script>
    // A still frame of the homepage's point-wave field, fading in toward the top right.
    const ctx = document.querySelector('canvas').getContext('2d');
    const W = 1200, H = 630;
    for (let row = 0; row < 26; row++) {
      const depth = row / 25;
      const spacing = 14 + depth * 22;
      const y = 40 + Math.pow(depth, 1.25) * 460;
      for (let x = -spacing; x < W + spacing; x += spacing) {
        const wave = Math.sin(x * 0.006 + row * 0.35) * 10 * (0.4 + depth);
        const fadeX = Math.min(1, Math.max(0, (x - 380) / 640));
        const fadeY = 1 - Math.min(1, Math.max(0, (y - 260) / 240));
        const alpha = fadeX * fadeY * (0.18 + depth * 0.4);
        if (alpha < 0.01) continue;
        const r = (0.9 + depth * 1.6) * (0.75 + 0.25 * Math.sin(x * 0.03 + row));
        ctx.fillStyle = `rgba(241, 241, 237, ${alpha})`;
        ctx.beginPath();
        ctx.arc(x, y + wave, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  </script>
</body>
</html>
